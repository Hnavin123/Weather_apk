<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>

</head>
<body>
    <header>
        <div class="input-container">
            <input type="text" placeholder="Enter locataion">
            <button id="search">Search</button>
        </div>
    </header>
    <main>
        <div class="weather-container">
            <div class="temprature">21.2</div>
            <div class="location-date">
                <div class="location">Kolkata</div>
                <span class="time">12.43</span>
                <span class="day">Monday</span>
                <span class="date">2025-05-4</span>
            </div>
            <div class="weather-state">
                <img src="https://ssl.gstatic.com/onebox/weather/64/partly_cloudy.png" alt="" class="emoji">
                <div class="condition">Sunny</div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
