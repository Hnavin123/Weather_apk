<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
       
    </style>
</head>
<body>
    <header>
        <div class="input-container">
            <input type="text" placeholder="Enter locataion">
            <button id="search">Search</button>
        </div>
    </header>
    <main>
        <div class="weather-container">
            <div class="temprature">21.2</div>
            <div class="location-date">
                <div class="location">Kolkata</div>
                <span class="time">12.43</span>
                <span class="day">Monday</span>
                <span class="date">2025-05-4</span>
            </div>
            <div class="weather-state">
                <img src="https://ssl.gstatic.com/onebox/weather/64/partly_cloudy.png" alt="">
                <div class="condition">Sunny</div>
            </div>
        </div>
    </main>
    <script>
        const searchButton = document.getElementById('search');
        searchButton.addEventListener('click', async function() {
            const searchInput = document.querySelector('.input-container input');
            const location = searchInput.value;
            //const data = await fetchWeatherData(location);
            if (location) {
                const data = await fetchWeatherData(location);
                //     fetchWeatherData(location).then((data) => {
                //         updateDOM(data);
                //     })
                if(data==null){
                   
                }
                else{
                    updateDOM(data);
                }
                searchInput.value = ''; // Clear the input field after search
            }
        });

        async function fetchWeatherData(location){
            const url =`http://api.weatherapi.com/v1/current.json?key=baba38db925b49c9895105718250405&q=${location}&aqi=no`;
            const response = await fetch(url);
            if (response.status==404) {
                alert('Location not found');
            } else if(response.status==200){
                const json = await response.json();
                return json;
            }
        }

        function updateDOM(data){
            console.log("I will update the UI with this data");
            console.log(data);
        }

    </script>
</body>
</html>
